version: '3.8'

services:
  change-detection-studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_VERSION: cu121
    container_name: change_detection_studio
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
